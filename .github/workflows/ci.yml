name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  # Per-commit ownership enforcement. Runs first and cheapest: a track that wrote outside its
  # paths is a structural violation, and there is no point spending CI minutes on the rest.
  ownership:
    name: ownership check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check Track trailers and file globs
        run: node scripts/check-ownership.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  quality:
    name: lint · typecheck · contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No inline lint suppressions
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -e 'eslint-disable' -e '@ts-ignore' -e '@ts-nocheck' apps packages e2e; then
            echo "::error::Lint/type suppressions are not allowed — fix the code or the rule."
            exit 1
          fi
      - name: No TODO or stub markers
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -e 'TODO' -e 'FIXME' -e 'XXX:' apps packages e2e; then
            echo "::error::TODO/FIXME markers are not allowed in code presented as finished."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm --filter @dataroom/contracts build
      - run: pnpm typecheck
      # The contracts fixture self-test ran locally under the old root `test` script and nowhere in
      # CI — the same class of gap as the coverage one, in the other direction. Root `test` is now
      # exactly these three commands, so the two sets cannot drift apart again without someone
      # editing both files.
      - run: pnpm --filter @dataroom/contracts test

  test-api:
    name: api — unit · integration · contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dataroom/contracts build
      # Testcontainers starts its own Postgres; the runner's Docker daemon is all it needs.
      - run: pnpm --filter @dataroom/api test:coverage

  test-web:
    name: web — component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dataroom/contracts build
      - run: pnpm --filter @dataroom/web test:coverage

  # The one input this repository does not write itself. Everything else is gated per commit; the
  # dependency graph was not gated at all, against a set of advisories that included a production
  # open-redirect in the router. `--prod` because a dev-only advisory is a developer-machine
  # concern, not a shipping one; `--audit-level=high` because that is the bar a build should stop
  # at. Remaining accepted moderates and their reachability rationale are in README.md.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No high or critical advisory in the production graph
        run: pnpm audit --prod --audit-level=high
      - name: Full graph, for the record
        if: always()
        continue-on-error: true
        run: pnpm audit

  # SPEC-10's delivery graph. Without this, a regression in cookies, storage CORS, signed redirects
  # or share revocation merges while CI stays green — every one of those is invisible to a unit
  # test by construction, because the thing under test is the boundary between two systems.
  #
  # Postgres is a service container and both apps are started here, so the browser drives the real
  # stack. `E2E_STORAGE_READY` is set only when the bucket secret is present: the storage-gated
  # specs skip with the reason named rather than failing for a missing credential, because a
  # permanently red suite teaches everyone to ignore it.
  e2e:
    name: e2e — browser flows
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dataroom
          POSTGRES_PASSWORD: dataroom
          POSTGRES_DB: dataroom
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # One database for the harness and the API both. Pointing them at different databases makes
      # every login fail in a way that looks exactly like a broken session (QA-F03).
      DATABASE_URL: postgres://dataroom:dataroom@127.0.0.1:5432/dataroom
      NODE_ENV: development
      PORT: '3000'
      WEB_ORIGIN: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:3000
      VITE_USE_MSW: 'false'
      E2E_WEB_URL: http://127.0.0.1:5173
      E2E_API_URL: http://127.0.0.1:3000
      JWT_ACCESS_SECRET: ci-access-secret-0000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-000000000000000000
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: 'false'
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3000/api/v1/auth/google/callback
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'placeholder-key' }}
      SUPABASE_BUCKET: ${{ secrets.E2E_SUPABASE_BUCKET || 'dataroom' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dataroom/contracts build
      - run: pnpm --filter @dataroom/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Storage-backed flows run only with a real bucket
        run: |
          if [ -n "${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "E2E_STORAGE_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No storage credential configured — the storage-gated specs will skip."
          fi
      - name: Start the API
        run: |
          pnpm --filter @dataroom/api build
          pnpm --filter @dataroom/api start &
          npx --yes wait-on http://127.0.0.1:3000/api/v1/health --timeout 90000
      - name: Start the web app
        run: |
          pnpm --filter @dataroom/web build
          pnpm --filter @dataroom/web exec vite preview --host 127.0.0.1 --port 5173 &
          npx --yes wait-on http://127.0.0.1:5173 --timeout 90000
      - run: pnpm test:e2e
      - name: Keep the traces of whatever failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Service-role key must not reach the browser bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY\|service_role" apps/web/dist; then
            echo "::error::A service-role reference reached the built web bundle."
            exit 1
          fi
      - name: MSW must not be bundled into production
        run: |
          if grep -rl "msw/browser\|mockServiceWorker" apps/web/dist; then
            echo "::error::MSW code reached the production bundle."
            exit 1
          fi
