services:
  - type: web
    name: dataroom-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: RATE_LIMIT_PER_MINUTE
        value: "1200"
      # Render terminates TLS at its own load balancer, which is one hop. Without this the
      # throttler sees the balancer's address for every request and all callers share one bucket.
      # Never `true`: that would trust the whole X-Forwarded-For chain and make it spoofable.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WEB_ORIGIN
        sync: false
